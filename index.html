<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 績效導航系統 · 小導</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --dark: #1A1A18;
    --text-primary: #1A1A18;
    --text-secondary: #6B6B65;
    --text-muted: #A0A09A;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.18);
    --purple-bg: #EEEDFE;
    --purple: #534AB7;
    --purple-dark: #3C3489;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    scroll-behavior: smooth;
  }

  /* ── LOGIN ── */
  .login-overlay {
    position: fixed; inset: 0; background: var(--dark); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
  }
  .login-overlay.hidden { display: none; }
  .login-box {
    width: 100%; max-width: 400px; padding: 52px 44px;
    border: 0.5px solid rgba(255,255,255,0.12); border-radius: 20px;
    background: rgba(255,255,255,0.04); text-align: center;
  }
  .login-icon { font-size: 36px; margin-bottom: 20px; }
  .login-box h2 { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 24px; color: #fff; margin-bottom: 8px; }
  .login-box p { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 30px; line-height: 1.7; }
  .login-input {
    width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.07);
    border: 0.5px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff;
    font-size: 15px; font-family: 'Noto Sans TC', sans-serif; outline: none;
    margin-bottom: 14px; text-align: center; letter-spacing: 0.1em; transition: border-color 0.2s;
  }
  .login-input:focus { border-color: rgba(83,74,183,0.7); }
  .login-btn {
    width: 100%; padding: 14px; background: var(--purple); border: none; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 500; font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; transition: opacity 0.2s;
  }
  .login-btn:hover { opacity: 0.88; }
  .login-btn:focus-visible, .login-input:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .login-error { font-size: 12px; color: #f87171; margin-top: 10px; min-height: 18px; }
  .login-footer { margin-top: 32px; font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 0.04em; }

  /* ── PORTAL ── */
  .portal { display: none; }
  .portal.visible { display: block; }

  /* Hero */
  .hero {
    background: var(--dark); color: #fff;
    padding: 76px 24px 60px;
    text-align: center;
  }
  .hero-eyebrow {
    display: inline-block; font-size: 11px; letter-spacing: 0.16em;
    color: rgba(255,255,255,0.45); border: 0.5px solid rgba(255,255,255,0.2);
    border-radius: 20px; padding: 5px 14px; margin-bottom: 22px;
  }
  .hero h1 {
    font-family: 'Noto Serif TC', serif; font-weight: 700;
    font-size: clamp(28px, 4.2vw, 40px); line-height: 1.3; margin-bottom: 14px;
  }
  .hero p {
    font-size: 15px; color: rgba(255,255,255,0.62); line-height: 1.9;
    max-width: 560px; margin: 0 auto;
  }
  .hero p strong { color: rgba(255,255,255,0.85); font-weight: 500; }

  .flow {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 8px; margin-top: 40px;
  }
  .flow-step {
    font-size: 12.5px; padding: 9px 16px; border-radius: 20px;
    border: 0.5px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.03); white-space: nowrap;
  }
  .flow-arrow { color: rgba(255,255,255,0.25); font-size: 14px; }

  /* Cards section */
  .cards-section { padding: 48px 24px 80px; max-width: 1080px; margin: 0 auto; }
  .cards-label {
    font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em; margin-bottom: 20px;
  }

  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px;
    padding: 26px 24px; display: flex; flex-direction: column;
    opacity: 0; transform: translateY(10px);
    animation: cardIn 0.5s ease forwards;
  }
  .card:nth-child(1) { animation-delay: 0.03s; }
  .card:nth-child(2) { animation-delay: 0.09s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.21s; }
  .card:nth-child(5) { animation-delay: 0.27s; }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }
  }

  .card-icon {
    width: 42px; height: 42px; border-radius: 11px; background: var(--purple-bg);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    margin-bottom: 16px;
  }
  .card-module-tag {
    font-size: 10px; letter-spacing: 0.1em; color: var(--purple); font-weight: 600;
    margin-bottom: 4px;
  }
  .card h3 {
    font-size: 16.5px; font-weight: 600; margin-bottom: 6px; line-height: 1.4;
  }
  .card-caption {
    font-size: 11.5px; color: var(--text-muted); margin-bottom: 14px;
  }
  .card-desc {
    font-size: 13px; color: var(--text-secondary); line-height: 1.75; margin-bottom: 18px;
    flex: 1;
  }
  .card-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .pill {
    font-size: 10.5px; color: var(--text-secondary); background: var(--bg);
    border: 0.5px solid var(--border); border-radius: 20px; padding: 4px 10px;
  }
  .card-btn {
    display: block; text-align: center; text-decoration: none;
    padding: 11px; border-radius: 10px; background: var(--purple); color: #fff;
    font-size: 13.5px; font-weight: 500; transition: opacity 0.15s;
  }
  .card-btn:hover { opacity: 0.88; }
  .card-btn:focus-visible { outline: 2px solid var(--purple-dark); outline-offset: 2px; }

  .footer-note {
    text-align: center; font-size: 11.5px; color: var(--text-muted);
    padding: 0 24px 48px; line-height: 1.8;
  }

  @media (max-width: 600px) {
    .hero { padding: 56px 18px 44px; }
    .flow-step { font-size: 11.5px; padding: 8px 13px; }
    .cards-section { padding: 40px 16px 60px; }
  }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">🧭</div>
    <h2>AI 績效導航系統</h2>
    <p>此系統僅供授權員工使用<br>請輸入存取密碼</p>
    <input type="password" class="login-input" id="passwordInput" placeholder="輸入密碼" onkeydown="if(event.key==='Enter') checkPassword()"/>
    <button class="login-btn" onclick="checkPassword()">進入系統</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-footer">EMPLOYEE PORTAL · 小導陪你走完每一步</div>
  </div>
</div>

<div class="portal" id="portal">

  <section class="hero">
    <div class="hero-eyebrow">AI PERFORMANCE MANAGEMENT SYSTEM</div>
    <h1>AI 績效導航系統</h1>
    <p>五個模組涵蓋完整的績效週期，從目標設定到個人發展，<br class="desktop-break">每一步都有<strong>小導</strong>陪你。</p>

    <div class="flow">
      <span class="flow-step">職能框架</span>
      <span class="flow-arrow">→</span>
      <span class="flow-step">設定承諾</span>
      <span class="flow-arrow">→</span>
      <span class="flow-step">日常記錄</span>
      <span class="flow-arrow">→</span>
      <span class="flow-step">年中／年度報告</span>
      <span class="flow-arrow">→</span>
      <span class="flow-step">個人發展計畫</span>
    </div>
  </section>

  <section class="cards-section">
    <div class="cards-label">選擇你現在需要的模組</div>
    <div class="cards-grid" id="cardsGrid"></div>
  </section>

  <div class="footer-note">我的績效我負責，做自己職涯的 CEO。</div>

</div>

<script>
// ============================================
// 登入
// ============================================
function checkPassword() {
  var input = document.getElementById('passwordInput').value;
  var error = document.getElementById('loginError');
  if (input === 'Gkgk0681') {
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('portal').classList.add('visible');
    sessionStorage.setItem('ep_auth', '1');
  } else {
    error.textContent = '密碼錯誤，請重新輸入';
    document.getElementById('passwordInput').value = '';
  }
}
if (sessionStorage.getItem('ep_auth') === '1') {
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('portal').classList.add('visible');
  });
}

// ============================================
// 模組設定（網址集中在這裡，之後改網址只要改這裡）
// ============================================
const MODULES = [
  {
    id: '01',
    icon: '🧭',
    title: '職能框架總覽',
    caption: '＝ 全年參考',
    desc: '了解各職等的能力要求與發展路徑，是其他所有模組的基礎。查看自己目前的職等定位，以及下一階層需具備的能力。',
    pills: ['Career Framework', 'Successful Profile'],
    url: 'https://individual-performance-coach.vercel.app/'
  },
  {
    id: '02',
    icon: '🤝',
    title: '績效承諾書',
    caption: '＝ 年初／週期開始時',
    desc: '與主管共同設定本績效週期的目標與承諾，對應職能框架的指標等級，讓期望清晰可衡量。',
    pills: ['目標設定', '績效指標'],
    url: 'https://individual-performance-coach-z3vf.vercel.app/'
  },
  {
    id: '03',
    icon: '📝',
    title: '每日工作記錄＋STAR 引導',
    caption: '＝ 日常使用',
    desc: '把每天的工作亮點記錄下來。小導用 STAR 框架引導你，把模糊的經驗轉化為清晰的績效紀錄，讓每個努力都被看見。',
    pills: ['STAR 引導', '績效指標對照', '日常記錄'],
    url: 'https://individual-performance-coach-vwd2.vercel.app/'
  },
  {
    id: '04',
    icon: '📊',
    title: '年中／年度績效報告',
    caption: '＝ 年中考核／年底考核',
    desc: '把承諾書與工作紀錄整合成一份完整的績效報告，自動生成員工自評版與給主管版，考核時直接使用。',
    pills: ['員工自評版', '給主管版', '績效對照'],
    url: 'https://individual-performance-coach-3kyu.vercel.app/'
  },
  {
    id: '05',
    icon: '🌱',
    title: '個人發展計畫（IDP）',
    caption: '＝ 每年制定一次',
    desc: '用 GROW 框架引導自我認知，結合職涯發展方向找出能力差距，制定一份有方向感、可執行的個人發展計畫。',
    pills: ['GROW 框架', '職涯發展', '每年更新'],
    url: 'https://individual-performance-coach-module.vercel.app/'
  }
];

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = MODULES.map(m => `
    <div class="card">
      <div class="card-icon">${m.icon}</div>
      <div class="card-module-tag">模組 ${m.id}</div>
      <h3>${m.title}</h3>
      <div class="card-caption">${m.caption}</div>
      <div class="card-desc">${m.desc}</div>
      <div class="card-pills">
        ${m.pills.map(p => `<span class="pill">${p}</span>`).join('')}
      </div>
      <a class="card-btn" href="${m.url}">進入模組 ${parseInt(m.id)} →</a>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', renderCards);
</script>

</body>
</html>
